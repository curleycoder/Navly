name: News cron (evening run)

# Vercel's Hobby plan allows only ONE cron run per day per job, so the 20:00 UTC
# half of the news fetch lives here instead. The 08:00 UTC run stays in vercel.json.
# Remove this workflow if the project ever moves to Vercel Pro.
on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger /api/cron/news
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ vars.SITE_URL || 'https://navly.ca' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET repo secret is not set — add it in Settings > Secrets and variables > Actions."
            exit 1
          fi

          CODE=$(curl -sS -L -o /tmp/out.json -w '%{http_code}' \
            --max-time 120 --retry 2 --retry-delay 10 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/news")

          echo "HTTP $CODE"
          cat /tmp/out.json
          echo

          if [ "$CODE" != "200" ]; then
            echo "::error::News cron returned HTTP $CODE"
            exit 1
          fi
