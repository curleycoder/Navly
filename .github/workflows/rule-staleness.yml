name: Check IRCC rule staleness

on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday 9am UTC
  workflow_dispatch:       # Allow manual trigger

jobs:
  staleness:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      # Never fails the job — a stale rule is reported as a GitHub issue instead,
      # because a red X in the Actions tab is easy to ignore and an issue is not.
      - name: Check rule staleness (90-day window)
        id: check
        run: |
          set +e
          OUT=$(npx tsx scripts/check-rule-staleness.ts 2>&1)
          CODE=$?
          echo "$OUT"
          {
            echo "report<<REPORT_EOF"
            echo "$OUT"
            echo "REPORT_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "stale=$CODE" >> "$GITHUB_OUTPUT"

      - name: Open staleness issue
        if: steps.check.outputs.stale != '0'
        uses: actions/github-script@v7
        env:
          REPORT: ${{ steps.check.outputs.report }}
        with:
          script: |
            const LABEL = 'rule-staleness'

            // Don't stack a new issue every Monday — reuse the open one.
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: LABEL,
            })
            if (open.length > 0) {
              core.notice(`Staleness issue #${open[0].number} is already open — skipping.`)
              return
            }

            const today = new Date().toISOString().slice(0, 10)
            const report = process.env.REPORT || '(no output captured)'

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Rules] IRCC rule set needs re-verification — ${today}`,
              body: [
                '## A rule set has not been verified in over 90 days',
                '',
                'Scoring rules drift when IRCC changes its published tables. Re-check the values',
                'against the official source below, then update `verifiedDate` in the rule file.',
                '',
                '```',
                report.trim(),
                '```',
                '',
                '### How to clear this',
                '',
                '1. Open each source URL above and compare it row by row with the rule file.',
                '2. **If the values changed:** add a new version file in `rules/<set>/<effectiveDate>.ts`',
                '   and register it in that folder\'s `index.ts` — do not edit history in place.',
                '3. **If the values are unchanged:** bump only `verifiedDate` to today.',
                '4. Run the suite and confirm the check passes:',
                '',
                '```bash',
                'npm test',
                'npx tsx scripts/check-rule-staleness.ts',
                '```',
                '',
                '5. Commit, push, and close this issue.',
                '',
                '> Reopened automatically next Monday if the rules are still stale.',
              ].join('\n'),
              labels: ['maintenance', LABEL],
            })
